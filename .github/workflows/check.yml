# Lint, typecheck, offline tests and the production build. The build reads the sportsdataverse-data
# release files over the network; the network tests stay skipped (BN_NETWORK_TESTS is not set).
# No step needs a Playwright browser (screenshots are a local check). Vercel's Git integration
# deploys, so there is no deploy step here.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
